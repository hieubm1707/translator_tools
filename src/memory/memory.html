<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title data-i18n="memory.pageTitle">Translation memory – Translator Tool</title>
  <link rel="stylesheet" href="../ui/theme.css" />
  <link rel="stylesheet" href="memory.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <span class="logo"><svg class="icon" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg></span>
      <div>
        <h1 data-i18n="memory.title">Translation memory</h1>
        <p class="muted" id="summary" data-i18n="common.loading">Loading…</p>
      </div>
    </header>

    <div class="toolbar">
      <div class="search">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="query" data-i18n-placeholder="memory.search" />
      </div>
      <button class="btn" id="clearCache" type="button">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span data-i18n="memory.clear">Clear memory</span>
      </button>
    </div>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-index" data-i18n="memory.colIndex">#</th>
            <th class="col-engine">Engine</th>
            <th class="col-site">Site</th>
            <th data-i18n="memory.colSource">Source</th>
            <th data-i18n="memory.colTranslation">Translation</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty muted" id="empty" hidden></p>
    </div>

    <nav class="pager">
      <button class="btn" id="prev" type="button" data-i18n="memory.prev">← Previous</button>
      <span class="muted" id="pageInfo"></span>
      <button class="btn" id="next" type="button" data-i18n="memory.next">Next →</button>
    </nav>
  </main>
  <div class="toast" id="status" role="status"></div>
  <script type="module" src="memory.js"></script>
</body>
</html>
